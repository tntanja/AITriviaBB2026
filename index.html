<!DOCTYPE html>
<html lang="en">
    
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Trivia</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <header class="game-header">
        <h1> AI TRIVIA </h1>
        <p> Kerää kaikki kuusi aihealuetta! </p>
    </header>

    <section class="status-panel">

        <!-- pelaaja  -->
        <article class="player-card">
            <h2> Pelaaja </h2>
            <img src="pelaaja.png" alt="pelaajan kuva">
            <p> Kerätyt aihealueet: 0 / 6 </p>
            <div> Aihealueet </div>
            <section> Kysymys: </section>
        </article>

        <!-- pelilauta  -->
        <section class="turn-panel">
            <p> Vuorossa </p>
            <h2> Pelaaja </h2>
            <button> Heitä noppaa </button>
            <div class="dice"> - </div>
            <div> PELILAUTA </div>
        </section>

        <!-- tekoäly  -->
        <article class="player-card">
            <h2> Tekoäly </h2>
            <img src="robotti.png" alt="tekoälyn kuva">
            <p> Kerätyt aihealueet: 0 / 6 </p>
            <div> Aihealueet </div>
            <section> Kysymys: </section>
        </article>

    </section>

</body>

</html>
